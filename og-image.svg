<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Space Grotesk', Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f9fd"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#0466c8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0466c8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- crop-mark corners (print signature) -->
  <g stroke="#0a0a0a" stroke-width="2">
    <path d="M40 64 H84 M64 40 V84"/>
    <path d="M1160 64 H1116 M1136 40 V84"/>
    <path d="M40 566 H84 M64 590 V546"/>
    <path d="M1160 566 H1116 M1136 590 V546"/>
  </g>

  <!-- registration mark -->
  <g transform="translate(1080 500)" stroke="#0466c8" stroke-width="1.6" fill="none">
    <circle cx="0" cy="0" r="20"/>
    <line x1="0" y1="-30" x2="0" y2="30"/>
    <line x1="-30" y1="0" x2="30" y2="0"/>
  </g>

  <!-- brand -->
  <text x="92" y="150" font-size="30" font-weight="700" fill="#0a0a0a">azil<tspan fill="#0466c8">.ma</tspan></text>
  <text x="94" y="182" font-size="16" font-weight="600" fill="#565f6b" font-family="'IBM Plex Mono', monospace" letter-spacing="2">DESIGN &amp; PRINT PRODUCTION</text>

  <!-- headline -->
  <text x="90" y="300" font-size="66" font-weight="700" fill="#0a0a0a" letter-spacing="-1">From vector file to</text>
  <text x="90" y="372" font-size="66" font-weight="700" fill="#0466c8" letter-spacing="-1">finished print, done right.</text>
  <text x="94" y="430" font-size="26" fill="#565f6b">Logos · business cards · labels · signage — Agadir, Morocco.</text>

  <!-- CMYK dots -->
  <g>
    <circle cx="110" cy="500" r="16" fill="#00aeef"/>
    <circle cx="150" cy="500" r="16" fill="#ec008c"/>
    <circle cx="190" cy="500" r="16" fill="#fff200"/>
    <circle cx="230" cy="500" r="16" fill="#0a0a0a"/>
    <text x="266" y="506" font-size="18" font-weight="600" fill="#565f6b" font-family="'IBM Plex Mono', monospace">CMYK · calibrated proof before print</text>
  </g>
</svg>
